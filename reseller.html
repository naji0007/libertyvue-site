<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My space — LibertyVue Player</title>
<style>
  :root { --bg:#060A12; --panel:#101724; --gold:#E8B64A; --text:#F5F7FA; --muted:#98A4B5; --border:#1F2A3D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 20px 60px; }
  nav.top { display:flex; align-items:center; gap:6px; padding:18px 0; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:10px; margin-right:auto; text-decoration:none; color:var(--text); }
  .logo .mark { width:42px; height:42px; background:var(--gold); border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#191508; font-size:20px; }
  .logo b { font-size:17px; display:block; line-height:1.1; } .logo span { font-size:9px; letter-spacing:3px; color:var(--gold); }
  nav.top a.lnk { color:var(--muted); text-decoration:none; font-size:14px; padding:9px 13px; border-radius:9px; }
  nav.top a.lnk:hover, nav.top a.lnk.on { color:var(--text); background:var(--panel); }
  .btn { display:inline-block; border-radius:10px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; border:1px solid transparent; text-decoration:none; }
  .btn.gold { background:var(--gold); color:#191508; }
  .btn.dark { background:#1A2436; color:var(--text); border-color:var(--border); }
  .btn.danger { background:transparent; color:#FF7D7D; border-color:#5a2b2b; }
  .eyebrow { color:var(--gold); font-size:11px; letter-spacing:3px; text-transform:uppercase; margin:30px 0 12px; }
  h1.hero { font-size:clamp(28px,4vw,40px); font-weight:800; letter-spacing:-1px; }
  .sub { color:var(--muted); margin:10px 0 8px; line-height:1.7; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px; margin-top:16px; }
  .card h3 { font-size:17px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td .mono { font-family:monospace; font-size:12px; word-break:break-all; }
  .rowbtns { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { display:inline-block; font-size:11px; border-radius:20px; padding:3px 12px; background:#1A2436; color:var(--gold); }
  .pill.trial { color:var(--muted); }
  input, select { width:100%; background:#0B1220; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px; font-size:14px; margin-top:6px; }
  label { font-size:12px; font-weight:600; display:block; margin-top:12px; color:var(--muted); }
  .grid2 { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .msg { margin-top:12px; font-size:13px; padding:10px; border-radius:10px; display:none; }
  .msg.ok { display:block; background:#0E2A1A; color:#7BD88F; }
  .msg.err { display:block; background:#2A1414; color:#FF7D7D; }
  footer { color:var(--muted); font-size:12px; text-align:center; margin-top:48px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a class="logo" href="index.html"><span class="mark">LV</span><span><b>LibertyVue</b><span>PLAYER</span></span></a>
    <a class="lnk" href="downloads.html">Downloads</a><a class="lnk" href="manage.html">Manage</a><a class="lnk on" href="reseller.html">My space</a>
    <a class="btn dark" href="#" onclick="logout();return false;">Log out</a>
  </nav>

  <div id="gate"><div class="eyebrow">Reseller space</div><h1 class="hero">Checking access…</h1></div>

  <div id="app" style="display:none">
    <div class="eyebrow">Reseller space</div>
    <h1 class="hero">My devices.</h1>
    <p class="sub">Add playlists to your customers' devices. Licence changes are done by the admin.</p>

    <div class="card"><h3>Devices</h3><div style="overflow-x:auto"><table>
      <thead><tr><th>Device</th><th>Licence</th><th>Expires</th></tr></thead>
      <tbody id="devices"></tbody>
    </table></div><div class="msg" id="msgD"></div></div>

    <div class="card"><h3>Playlists</h3>
      <label>Device</label><select id="pdev"></select>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Name</th><th>Type</th><th>URL</th><th></th></tr></thead>
        <tbody id="plist"></tbody>
      </table></div>
      <div class="grid2">
        <div><label>Name</label><input id="pname" placeholder="My playlist"></div>
        <div><label>Type</label><select id="ptype"><option value="M3U">M3U / M3U8</option><option value="XTREAM">Xtream</option></select></div>
      </div>
      <label>URL</label><input id="purl" placeholder="https://…">
      <div class="grid2">
        <div><label>Username (Xtream)</label><input id="puser"></div>
        <div><label>Password (Xtream)</label><input id="ppass" type="password"></div>
      </div>
      <button class="btn gold" style="margin-top:14px" onclick="addPlaylist()">Add playlist</button>
      <div class="msg" id="msgP"></div>
    </div>
  </div>

  <footer>© 2026 LibertyVue Player</footer>
</div>

<script src="./supabase.js"></script>
<script>
let sb = null;
try {
  if (typeof supabase !== 'undefined') sb = supabase.createClient(
  "https://zioesbhpkkcqfivtqlqt.supabase.co",
  "sb_publishable_cVKOB24p11DwVfQ2uRJOLw_WwIjoyUF"
);
} catch (e) { sb = null; }
function show(id, ok, text) {
  const m = document.getElementById(id);
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
}
function fmtDate(ms) {
  if (!ms) return '—';
  return new Date(Number(ms)).toLocaleDateString('fr-FR');
}
async function logout() { await sb.auth.signOut(); location.href = 'login.html'; }

async function init() {
  if (!sb) {
    document.getElementById('gate').innerHTML =
      '<div class="eyebrow">Reseller space</div><h1 class="hero">Library blocked.</h1><p style="color:var(--muted)">Disable adblock/VPN for this page and reload.</p>';
    return;
  }
  const s = await sb.auth.getSession();
  if (!s.data.session) { location.href = 'login.html'; return; }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadDevices();
}
async function loadDevices() {
  const d = await sb.from('devices').select('*').order('created_at', { ascending: false });
  if (d.error) return show('msgD', false, d.error.message);
  if (!d.data || !d.data.length) {
    document.getElementById('devices').innerHTML =
      '<tr><td colspan="3" style="color:var(--muted)">No devices yet. Ask the admin to assign devices to your account.</td></tr>';
    return;
  }
  const ids = d.data.map(x => x.device_id);
  const l = await sb.from('licenses').select('*').in('device_id', ids);
  const lic = {};
  (l.data || []).forEach(x => lic[x.device_id] = x);
  const tb = document.getElementById('devices');
  tb.innerHTML = '';
  const sel = document.getElementById('pdev');
  sel.innerHTML = '';
  d.data.forEach(dev => {
    const L = lic[dev.device_id];
    const st = L ? L.status : 'trial';
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><div class="mono">' + esc(dev.device_id) + '</div></td>' +
      '<td><span class="pill' + (st === 'trial' ? ' trial' : '') + '">' + esc(st + (L && L.type ? ' · ' + L.type : '')) + '</span></td>' +
      '<td>' + esc(L && L.expires_at ? fmtDate(L.expires_at) : '—') + '</td>';
    tb.appendChild(tr);
    const o = document.createElement('option');
    o.value = dev.device_id; o.textContent = dev.device_id;
    sel.appendChild(o);
  });
  loadPlaylists();
}
async function loadPlaylists() {
  const id = document.getElementById('pdev').value;
  if (!id) return;
  const r = await sb.from('playlists').select('*').eq('device_id', id).order('name');
  if (r.error) return show('msgP', false, r.error.message);
  const tb = document.getElementById('plist');
  tb.innerHTML = '';
  (r.data || []).forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + esc(p.name) + '</td><td>' + esc(p.type) + '</td><td><div class="mono">' + esc(p.url) + '</div></td><td></td>';
    const b = document.createElement('button');
    b.className = 'btn danger'; b.textContent = 'Delete';
    b.onclick = async () => {
      if (!confirm('Delete ' + p.name + '?')) return;
      const x = await sb.from('playlists').delete().eq('id', p.id);
      if (x.error) return show('msgP', false, x.error.message);
      loadPlaylists();
    };
    tr.lastChild.appendChild(b);
    tb.appendChild(tr);
  });
}
document.getElementById('pdev').addEventListener('change', loadPlaylists);
async function addPlaylist() {
  const id = document.getElementById('pdev').value;
  const body = {
    device_id: id,
    name: document.getElementById('pname').value.trim() || 'Playlist',
    type: document.getElementById('ptype').value,
    url: document.getElementById('purl').value.trim(),
    username: document.getElementById('puser').value.trim(),
    password: document.getElementById('ppass').value,
    origin: 'REMOTE', epg_url: ''
  };
  if (!id) return show('msgP', false, 'No device.');
  if (!body.url) return show('msgP', false, 'Enter the URL.');
  const r = await sb.from('playlists').insert(body);
  if (r.error) return show('msgP', false, r.error.message);
  show('msgP', true, 'Saved. Press Sync on the TV.');
  loadPlaylists();
}
init();
</script>
</body>
</html>
