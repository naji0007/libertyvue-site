<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — LibertyVue Player</title>
<style>
  :root { --bg:#060A12; --panel:#101724; --gold:#E8B64A; --text:#F5F7FA; --muted:#98A4B5; --border:#1F2A3D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:0 20px 60px; }
  nav.top { display:flex; align-items:center; gap:6px; padding:18px 0; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:10px; margin-right:auto; text-decoration:none; color:var(--text); }
  .logo .mark { width:42px; height:42px; background:var(--gold); border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#191508; font-size:20px; }
  .logo b { font-size:17px; display:block; line-height:1.1; } .logo span { font-size:9px; letter-spacing:3px; color:var(--gold); }
  nav.top a.lnk { color:var(--muted); text-decoration:none; font-size:14px; padding:9px 13px; border-radius:9px; }
  nav.top a.lnk:hover, nav.top a.lnk.on { color:var(--text); background:var(--panel); }
  .btn { display:inline-block; border-radius:12px; padding:13px 26px; font-weight:700; font-size:15px; text-decoration:none; cursor:pointer; border:1px solid transparent; }
  .btn.gold { background:var(--gold); color:#191508; }
  .btn.dark { background:var(--panel); color:var(--text); border-color:var(--border); }
  .eyebrow { color:var(--gold); font-size:11px; letter-spacing:3px; text-transform:uppercase; margin:34px 0 14px; }
  h1.hero { font-size:clamp(30px,5vw,44px); font-weight:800; letter-spacing:-1px; }
  .sub { color:var(--muted); margin:12px 0 24px; line-height:1.7; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:28px; }
  .tabs { display:flex; gap:8px; margin-bottom:6px; }
  .tabs button { flex:1; background:#0B1220; color:var(--muted); border:1px solid var(--border); border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .tabs button.on { background:var(--gold); color:#191508; border-color:var(--gold); }
  label { font-size:13px; font-weight:600; display:block; margin-top:16px; }
  input { width:100%; background:#0B1220; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:14px; font-size:14px; margin-top:6px; }
  .full { width:100%; text-align:center; margin-top:20px; border:none; font-size:16px; }
  .msg { margin-top:14px; font-size:14px; display:none; padding:12px; border-radius:10px; line-height:1.6; }
  .msg.ok { display:block; background:#0E2A1A; color:#7BD88F; }
  .msg.err { display:block; background:#2A1414; color:#FF7D7D; }
  footer { color:var(--muted); font-size:12px; text-align:center; margin-top:48px; }
  footer a { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a class="logo" href="index.html"><span class="mark">LV</span><span><b>LibertyVue</b><span>PLAYER</span></span></a>
    <a class="lnk" href="downloads.html">Downloads</a><a class="lnk" href="guides.html">Guides</a><a class="lnk" href="activate.html">Activate</a><a class="lnk" href="manage.html">Manage playlists</a><a class="lnk" href="support.html">Support</a><a class="lnk on" href="login.html">Login</a>
  </nav>

  <div class="eyebrow">Resellers & Admins</div>
  <h1 class="hero">Log in to your space.</h1>
  <p class="sub">Resellers manage their customers and devices. Admins manage everything, including licences.</p>

  <div class="card">
    <div class="tabs">
      <button id="tabR" class="on" onclick="tab('reseller')">Reseller</button>
      <button id="tabA" onclick="tab('admin')">Admin</button>
    </div>
    <label>Email</label><input id="email" type="email" placeholder="you@example.com">
    <label>Mot de passe / Password</label><input id="password" type="password" placeholder="••••••••">
    <button class="btn gold full" onclick="login()">Log in</button>
    <div class="msg" id="msg"></div>
  </div>

  <footer>© 2026 LibertyVue Player · <a href="index.html">Home</a></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  "https://zioesbhpkkcqfivtqlqt.supabase.co",
  "sb_publishable_cVKOB24p11DwVfQ2uRJOLw_WwIjoyUF"
);
let mode = 'reseller';
function tab(m) {
  mode = m;
  document.getElementById('tabR').classList.toggle('on', m === 'reseller');
  document.getElementById('tabA').classList.toggle('on', m === 'admin');
}
function show(ok, text) {
  const m = document.getElementById('msg');
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
}
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) return show(false, 'Enter email and password.');
  show(true, 'Connecting…');
  try {
    const r = await sb.auth.signInWithPassword({ email, password });
    if (r.error) throw r.error;
    const p = await sb.from('profiles').select('role').eq('id', r.data.user.id).maybeSingle();
    if (p.error) throw p.error;
    const role = (p.data && p.data.role) || 'reseller';
    if (mode === 'admin' && role !== 'admin')
      return show(false, 'This account is not an admin.');
    if (mode === 'reseller' && role === 'admin') {
      location.href = 'dashboard.html';
      return;
    }
    if (role === 'admin') {
      location.href = 'dashboard.html';
      return;
    }
    location.href = 'reseller.html';
  } catch (e) {
    show(false, e.message || 'Login failed.');
  }
}
</script>
</body>
</html>
